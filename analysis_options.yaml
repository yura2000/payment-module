include: package:flutter_lints/flutter.yaml

plugins:
  import_lint: ^2.0.0

import_lint:
  severity: error
  rules:
    core_is_flutter_free:
      target: "package:payment_module/core/**.dart"
      from: "package:flutter/**.dart"
      except: []
    core_depends_on_nothing:
      target: "package:payment_module/core/**.dart"
      from: "package:payment_module/{brand_engine,native_bridge,features,app,brands,bootstrap}/**.dart"
      except: []
    engine_knows_no_features:
      target: "package:payment_module/brand_engine/**.dart"
      from: "package:payment_module/{native_bridge,features,app,brands,bootstrap}/**.dart"
      except: []
    native_bridge_depends_on_core_only:
      target: "package:payment_module/native_bridge/**.dart"
      from: "package:payment_module/{brand_engine,features,app,brands,bootstrap}/**.dart"
      except: []
    native_bridge_via_barrel:
      target: "package:payment_module/{features,bootstrap}/**.dart"
      from: "package:payment_module/native_bridge/src/**.dart"
      except: []
    domain_no_data:
      target: "package:payment_module/features/*/src/domain/**.dart"
      from: "package:payment_module/features/*/src/data/**.dart"
      except: []
    domain_no_presentation:
      target: "package:payment_module/features/*/src/domain/**.dart"
      from: "package:payment_module/features/*/src/presentation/**.dart"
      except: []
    domain_no_flutter:
      target: "package:payment_module/features/*/src/domain/**.dart"
      from: "package:flutter/**.dart"
      except: []
    presentation_no_data:
      target: "package:payment_module/features/*/src/presentation/**.dart"
      from: "package:payment_module/features/*/src/data/**.dart"
      except: []
    security_guard_via_barrel:
      target: "package:payment_module/features/payment/**.dart"
      from: "package:payment_module/features/security_guard/src/**.dart"
      except: []
    no_reverse_dependency:
      target: "package:payment_module/features/security_guard/**.dart"
      from: "package:payment_module/features/payment/**.dart"
      except: []

linter:
  rules:
    prefer_single_quotes: true
